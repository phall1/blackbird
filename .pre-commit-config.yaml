minimum_prek_version: "0.2.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt (autofix)
        entry: gofmt -w
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
      # Advisory, and opt-in twice over: it only runs for people who installed
      # these hooks at all, and it only refuses a commit when BLACKBIRD_AGENT_NAME
      # identifies you well enough to tell your own lease from a teammate's.
      # Otherwise it warns. It is a courtesy check in the one place a shared
      # checkout collides -- not file locking, and `--no-verify` walks past it.
      # A daemon that is down, or a repo it has never seen, is never a reason to
      # refuse a commit, so every failure here passes.
      - id: blackbird-lease-guard
        name: blackbird lease guard (advisory)
        entry: go run ./cmd/blackbird lease-guard
        language: system
        require_serial: true

      - id: golangci-fast
        name: golangci-lint (fast)
        entry: golangci-lint run --fix --fast-only
        language: system
        pass_filenames: false
      - id: quality-gate
        name: full quality gate
        entry: make check
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
