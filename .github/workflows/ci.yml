name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, vet, vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - name: Verify module and generated formatting
        run: |
          go mod verify
          go mod tidy -diff
          test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.0
      - name: Vulnerability analysis
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - name: Race detector and shuffled tests
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...
      - name: Enforce coverage floor
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v total="$total" 'BEGIN { if (total + 0 < 59.0) { printf "coverage %.1f%% is below 59.0%%\n", total; exit 1 } }'
      - name: Repeat tests to expose order and concurrency flakes
        run: go test -shuffle=on -count=3 ./...
      - name: Build all packages without CGO
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath ./...
      - name: Upload coverage
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14
