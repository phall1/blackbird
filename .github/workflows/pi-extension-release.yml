name: Release Pi extension

on:
  push:
    tags: ["pi-extension-v*.*.*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Existing pi-extension-vX.Y.Z tag", required: true, type: string }
      dry_run: { description: "Validate without publishing", required: true, default: true, type: boolean }

permissions: { contents: read }
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/pi-extension/package-lock.json
      - name: Validate, pack, and publish
        working-directory: packages/pi-extension
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          DRY_RUN: ${{ github.event_name == 'push' && 'false' || inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1
          [[ "$TAG" =~ ^pi-extension-v([0-9]+[.][0-9]+[.][0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          npm ci
          npm run gates
          tarball="$(npm pack --json --ignore-scripts | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s)[0].filename))')"
          if [[ "$DRY_RUN" == false ]]; then
            local_shasum="$(sha1sum "$tarball" | cut -d' ' -f1)"
            published_shasum="$(npm view "blackbird-pi@${version}" dist.shasum 2>/dev/null || true)"
            if [[ -n "$published_shasum" ]]; then
              test "$published_shasum" = "$local_shasum"
            else
              npm publish --provenance --access public "$tarball"
            fi
            gh release view "$TAG" >/dev/null
            gh release upload "$TAG" "$tarball" --clobber
          else
            npm publish --dry-run "$tarball"
          fi
